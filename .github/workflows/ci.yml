name: Scientific Pipeline CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  test-suite:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package in editable mode
        run: pip install -e .
      - name: Run deterministic unit & benchmark suite
        run: python -m unittest discover -s tests -v
      - name: Smoke-test CLI on ClinVar APOA1/RNU4ATAC benchmark
        run: splice-vus-deconv --benchmark
